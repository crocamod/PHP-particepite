<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Дневник оценок</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 640px; margin: 20px auto; padding: 0 12px; background: #f4f6fb; }
        [hidden] { display: none; }
        .box { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        input, select { padding: 6px; margin: 4px 0; }
        button { padding: 6px 12px; margin: 2px; cursor: pointer; }
        .grade { background: #e8efff; border: none; border-radius: 4px; padding: 4px 10px; }
        .subject { border-top: 1px solid #ddd; padding-top: 10px; margin-top: 10px; }
        #notes { position: fixed; bottom: 16px; right: 16px; }
        .note { background: #333; color: #fff; padding: 8px 12px; border-radius: 6px; margin-top: 6px; }
    </style>
</head>
<body>
    <h1>Дневник оценок</h1>

    <div id="loginBox" class="box" hidden>
        <p>Войдите или зарегистрируйтесь</p>
        <input id="login" placeholder="Логин"><br>
        <input id="password" type="password" placeholder="Пароль (от 8 символов)"><br>
        <button id="loginButton">Войти</button>
        <button id="registerButton">Регистрация</button>
    </div>

    <div id="diaryBox" hidden>
        <div class="box">
            <span id="userName"></span>
            <button id="logoutButton">Выйти</button>
            <p>Средний балл по всем предметам: <b id="overall"></b></p>
        </div>
        <div class="box">
            <input id="subjectName" placeholder="Новый предмет">
            <button id="addSubjectButton">Добавить предмет</button>
        </div>
        <div class="box" id="subjects"></div>
    </div>

    <div id="notes"></div>
    <script src="app.js"></script>
</body>
</html>
